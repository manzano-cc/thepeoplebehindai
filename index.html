<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The People Behind AI | An open directory of AI model builders</title>
  <meta name="description" content="An open directory of the people who build AI models in the United States and Europe: title, organization, level and area, using only public professional information.">
  <meta name="theme-color" content="#2D344B">
  <link rel="canonical" href="https://thepeoplebehindai.org/">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="The People Behind AI">
  <meta property="og:locale" content="en_US">
  <meta property="og:title" content="The People Behind AI | An open directory of AI model builders">
  <meta property="og:description" content="An open directory of who builds AI models in the United States and Europe, using public professional information.">
  <meta property="og:url" content="https://thepeoplebehindai.org/">
  <meta property="og:image" content="https://thepeoplebehindai.org/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="The People Behind AI: who builds AI models">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="The People Behind AI">
  <meta name="twitter:description" content="An open directory of who builds AI models in the United States and Europe.">
  <meta name="twitter:image" content="https://thepeoplebehindai.org/assets/og-image.png">

  <link rel="icon" href="favicon.ico?v=2" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/iconos/favicon-32x32.png?v=2">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/iconos/favicon-16x16.png?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/iconos/apple-touch-icon.png?v=2">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="cabecera">
    <h1 class="titulo"><a class="titulo-enlace" href="index.html"><img class="logo" src="assets/logo.svg" alt="The People Behind AI" width="93" height="30"></a></h1>
    <div class="cabecera-der">
      <a class="nav-enlace" href="about.html">About</a>
      <p class="contador" id="contador" aria-live="polite"></p>
    </div>
  </header>

  <section class="hero" id="hero">
    <a class="hero-patrocinio" href="https://aigea.org" target="_blank" rel="noopener noreferrer" aria-label="Developed by AIGEA"><span>Developed by</span><img src="assets/aigea.svg" alt="AIGEA" width="77" height="14"></a>
    <h2 class="hero-titulo">Meet the people building<span class="hero-acento">the world's AI models</span></h2>
    <p class="hero-sub">An open directory of <span id="hero-total">thousands of</span> researchers, engineers and leaders at AI labs in the United States and Europe, built only from public professional information.</p>
  </section>

  <div class="filtros" id="filtros" role="search">
    <input class="buscador" id="buscador" type="search" placeholder="Search by name, company or title" aria-label="Search by name, company or title" autocomplete="off">
    <div class="selectores" id="selectores" role="group" aria-label="Filters"></div>
    <button class="boton-filtros" id="abrir-filtros" type="button" aria-haspopup="dialog" aria-controls="panel-filtros" aria-expanded="false">
      Filters<span class="insignia" id="insignia-filtros" hidden></span>
    </button>
    <button class="boton-limpiar" id="limpiar" type="button" hidden>Clear filters</button>
  </div>

  <main class="contenedor-tabla">
    <table class="tabla" id="tabla" aria-label="People">
      <thead>
        <tr>
          <th class="col-foto" scope="col"><span class="sr-only">Photo</span></th>
          <th scope="col" data-orden="nombre"><button type="button" class="orden">Name<span class="flecha" aria-hidden="true"></span></button></th>
          <th scope="col" data-orden="cargo_literal"><button type="button" class="orden">Title<span class="flecha" aria-hidden="true"></span></button></th>
          <th scope="col" data-orden="empresa"><button type="button" class="orden">Company<span class="flecha" aria-hidden="true"></span></button></th>
          <th scope="col" data-orden="area"><button type="button" class="orden">Area<span class="flecha" aria-hidden="true"></span></button></th>
          <th scope="col" data-orden="nivel"><button type="button" class="orden">Level<span class="flecha" aria-hidden="true"></span></button></th>
          <th class="col-enlaces" scope="col">Links</th>
        </tr>
      </thead>
      <tbody id="cuerpo"></tbody>
    </table>

    <div class="vacio" id="vacio" hidden>
      <p class="vacio-texto">No people match these filters.</p>
      <button class="boton-limpiar" id="limpiar-vacio" type="button">Clear filters</button>
    </div>

    <div class="centinela" id="centinela" aria-hidden="true"></div>
  </main>

  <!-- Dark overlay shared by the profile panel and the mobile filters -->
  <div class="fondo" id="fondo"></div>

  <!-- Individual profile -->
  <aside class="ficha" id="ficha" role="dialog" aria-modal="true" aria-labelledby="ficha-nombre" tabindex="-1">
    <button class="ficha-cerrar" id="ficha-cerrar" type="button" aria-label="Close profile">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12 19 6.4 17.6 5 12 10.6z"/></svg>
    </button>
    <div class="ficha-contenido" id="ficha-contenido"></div>
  </aside>

  <!-- Mobile filters (full screen) -->
  <section class="panel-filtros" id="panel-filtros" role="dialog" aria-modal="true" aria-labelledby="panel-filtros-titulo" tabindex="-1">
    <div class="panel-filtros-cabecera">
      <h2 class="panel-filtros-titulo" id="panel-filtros-titulo">Filters</h2>
      <button class="boton-limpiar" id="limpiar-movil" type="button" hidden>Clear</button>
      <button class="ficha-cerrar" id="cerrar-filtros" type="button" aria-label="Close filters">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12 19 6.4 17.6 5 12 10.6z"/></svg>
      </button>
    </div>
    <div class="panel-filtros-cuerpo" id="panel-filtros-cuerpo"></div>
    <div class="panel-filtros-pie">
      <button class="boton-principal" id="ver-resultados" type="button">Show results</button>
    </div>
  </section>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
